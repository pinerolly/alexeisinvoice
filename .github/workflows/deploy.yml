name: Deploy to VPS

# Auto-deploy on push is disabled: deployments are now driven from the VPS
# itself. Run this workflow manually from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            APP_ROOT=/home/ubuntu/docker/alexeisinvoice
            DATA_ROOT=/srv/invoice

            sudo mkdir -p "$DATA_ROOT/data" "$DATA_ROOT/minio" "$DATA_ROOT/caddy/data" "$DATA_ROOT/caddy/config" "$DATA_ROOT/secrets"

            cd "$APP_ROOT"
            git pull origin main

            if ! command -v rclone >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y rclone
            fi

            sudo install -m 0755 "$APP_ROOT/scripts/backup_invoices_to_gdrive.sh" /usr/local/bin/backup_invoices_to_gdrive.sh
            sudo install -m 0644 "$APP_ROOT/ops/invoice-gdrive-backup.service" /etc/systemd/system/invoice-gdrive-backup.service
            sudo install -m 0644 "$APP_ROOT/ops/invoice-gdrive-backup.timer" /etc/systemd/system/invoice-gdrive-backup.timer
            sudo systemctl daemon-reload
            sudo systemctl enable --now invoice-gdrive-backup.timer
            sudo systemctl start invoice-gdrive-backup.service || true

            # Rebuild and force restart the stack with persistent host paths.
            sudo APP_SECRETS_FILE="$DATA_ROOT/secrets/invoice.env" \
              INVOICE_DATA_DIR="$DATA_ROOT/data" \
              MINIO_DATA_DIR="$DATA_ROOT/minio" \
              CADDYFILE_PATH=./Caddyfile.production \
              CADDY_DATA_DIR="$DATA_ROOT/caddy/data" \
              CADDY_CONFIG_DIR="$DATA_ROOT/caddy/config" \
              SITE_HOST="${{ secrets.SITE_HOST }}" \
              docker compose up -d --build --force-recreate

            # Optional: Remove unused old images to keep your server clean 
            sudo docker image prune -f
