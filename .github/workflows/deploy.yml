name: Deploy to VPS

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd   /home/ubuntu/docker/alexeisinvoice      #/path/to/your/project
            git pull origin main
            # Rebuild and force restart the container if it's already running 
            sudo docker compose up -d --build --force-recreate 
            # Optional: Remove unused old images to keep your server clean 
            sudo docker image prune -f
