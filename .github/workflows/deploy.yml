name: Deploy to VPS

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/deploy-ssh"
          printf '%s' "$VPS_SSH_KEY" | tr -d '\r' > "${RUNNER_TEMP}/deploy-ssh/id_rsa"
          chmod 600 "${RUNNER_TEMP}/deploy-ssh/id_rsa"

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key_path: ${{ runner.temp }}/deploy-ssh/id_rsa
          script: |
            cd   /home/ubuntu/docker/alexeisinvoice      #/path/to/your/project
            git pull origin main
            # Add build/restart commands below (e.g., docker compose up -d --build)
            sudo docker compose up -d --build
