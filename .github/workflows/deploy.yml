name: Deploy to VPS

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_ROOT=/home/ubuntu/docker/alexeisinvoice
            DATA_ROOT=/srv/invoice

            sudo mkdir -p "$DATA_ROOT/data" "$DATA_ROOT/minio" "$DATA_ROOT/caddy/data" "$DATA_ROOT/caddy/config" "$DATA_ROOT/secrets"

            cd "$APP_ROOT"
            git pull origin main

            # Rebuild and force restart the stack with persistent host paths.
            sudo APP_SECRETS_FILE="$DATA_ROOT/secrets/invoice.env" \
              INVOICE_DATA_DIR="$DATA_ROOT/data" \
              MINIO_DATA_DIR="$DATA_ROOT/minio" \
              CADDYFILE_PATH=./Caddyfile.production \
              CADDY_DATA_DIR="$DATA_ROOT/caddy/data" \
              CADDY_CONFIG_DIR="$DATA_ROOT/caddy/config" \
              SITE_HOST="${{ secrets.SITE_HOST }}" \
              docker compose up -d --build --force-recreate

            # Optional: Remove unused old images to keep your server clean 
            sudo docker image prune -f
