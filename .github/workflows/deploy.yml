name: Deploy to VPS

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p "${RUNNER_TEMP}/deploy-ssh"
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["VPS_SSH_KEY"]
          for source, target in (("\\r\\n", "\n"), ("\r\n", "\n"), ("\\n", "\n"), ("\\r", "\n"), ("\r", "\n")):
              key = key.replace(source, target)
          if not key.endswith("\n"):
              key += "\n"
          path = Path(os.environ["RUNNER_TEMP"], "deploy-ssh", "id_rsa")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as handle:
              handle.write(key)
          PY

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key_path: ${{ runner.temp }}/deploy-ssh/id_rsa
          script: |
            cd   /home/ubuntu/docker/alexeisinvoice      #/path/to/your/project
            git pull origin main
            # Add build/restart commands below (e.g., docker compose up -d --build)
            sudo docker compose up -d --build
