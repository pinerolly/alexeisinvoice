<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clientes - Electroclima Pro Services, LLC</title>
    <style>
      :root {
        --primary: #1c3d5a;
        --accent: #2e86ab;
        --light-bg: #f4f7f9;
        --border: #d9e2e8;
        --text: #2b2b2b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: #e9edf0;
        margin: 0;
        padding: 20px;
      }
      .page {
        max-width: 1000px;
        margin: auto;
      }
      .panel {
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 20px;
        color: var(--primary);
        margin-top: 0;
      }
      .search-form {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .search-form input[type="text"] {
        flex: 1;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 14px;
      }
      .search-form button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        background: var(--primary);
        color: #fff;
        text-align: left;
        padding: 10px 12px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      tbody td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      tbody tr:hover {
        background: var(--light-bg);
      }
      tbody td.num {
        text-align: right;
        font-weight: 600;
      }
      tbody td.num-center {
        text-align: center;
        font-weight: 600;
      }
      .count-red {
        color: #842029;
      }
      .count-green {
        color: #0f5132;
      }
      a.client-link {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }
      a.client-link:hover {
        text-decoration: underline;
      }
      .empty {
        color: #777;
        font-size: 14px;
        padding: 20px 0;
        text-align: center;
      }
      @media (max-width: 700px) {
        body {
          padding: 12px;
        }
        .panel {
          padding: 16px;
        }
        .search-form {
          flex-direction: column;
        }
        table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    {{template "nav" .}}

    <div class="page">
      <div class="panel">
        <h1>Clientes</h1>
        <form class="search-form" method="GET" action="/clients">
          <input
            type="text"
            name="q"
            value="{{.Search}}"
            placeholder="Buscar por nombre, teléfono o correo..."
          />
          <button type="submit">Buscar</button>
        </form>

        {{if .Clients}}
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th style="text-align: center">Deudas</th>
              <th style="text-align: right">Deuda Total</th>
            </tr>
          </thead>
          <tbody>
            {{range .Clients}}
            <tr>
              <td>
                <a class="client-link" href="/clients/{{.ID}}">{{.Name}}</a>
              </td>
              <td class="num-center {{if gt .UnpaidCount 0}}count-red{{else}}count-green{{end}}">{{.UnpaidCount}}</td>
              <td class="num">{{money .OwedTotal}}</td>
            </tr>
            {{end}}
          </tbody>
        </table>
        {{else}}
        <div class="empty">No se encontraron clientes.</div>
        {{end}}
      </div>
    </div>
  </body>
</html>
