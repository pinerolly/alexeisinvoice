<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account - Electroclima Pro Services, LLC</title>
    <style>
      :root {
        --primary: #1c3d5a;
        --accent: #2e86ab;
        --border: #d9e2e8;
        --text: #2b2b2b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: #e9edf0;
        margin: 0;
        padding: 20px;
      }
      .page {
        max-width: 480px;
        margin: auto;
      }
      .panel {
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 20px;
        color: var(--primary);
        margin-top: 0;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: #555;
        margin: 14px 0 4px;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
      }
      button {
        margin-top: 20px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        background: #f8d7da;
        color: #842029;
        border: 1px solid #f5c2c7;
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .success {
        background: #d1e7dd;
        color: #0f5132;
        border: 1px solid #badbcc;
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    {{template "nav" .}}

    <div class="page">
      <div class="panel">
        <h1>Account: {{.Username}}</h1>
        {{if .Error}}
        <div class="error">{{.Error}}</div>
        {{end}} {{if .Success}}
        <div class="success">{{.Success}}</div>
        {{end}}
        <form method="POST" action="/account">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
          <label for="current_password">Current Password</label>
          <input
            type="password"
            id="current_password"
            name="current_password"
            autocomplete="current-password"
            required
          />

          <label for="new_password">New Password</label>
          <input
            type="password"
            id="new_password"
            name="new_password"
            autocomplete="new-password"
            required
          />

          <label for="confirm_password">Confirm New Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            autocomplete="new-password"
            required
          />

          <button type="submit">Update Password</button>
        </form>
      </div>
    </div>
  </body>
</html>
