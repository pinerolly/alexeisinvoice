<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users - Electroclima Pro Services, LLC</title>
    <style>
      :root {
        --primary: #1c3d5a;
        --accent: #2e86ab;
        --light-bg: #f4f7f9;
        --border: #d9e2e8;
        --text: #2b2b2b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background: #e9edf0;
        margin: 0;
        padding: 20px;
      }
      .page {
        max-width: 800px;
        margin: auto;
      }
      .panel {
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.08);
        margin-bottom: 20px;
      }
      h1,
      h2 {
        font-size: 18px;
        color: var(--primary);
        margin-top: 0;
      }
      .error {
        background: #f8d7da;
        color: #842029;
        border: 1px solid #f5c2c7;
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .success {
        background: #d1e7dd;
        color: #0f5132;
        border: 1px solid #badbcc;
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        background: var(--primary);
        color: #fff;
        text-align: left;
        padding: 10px 12px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      tbody td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      tbody tr:hover {
        background: var(--light-bg);
      }
      .role-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .role-admin {
        background: #cfe3f0;
        color: var(--primary);
      }
      .role-user {
        background: var(--light-bg);
        color: #555;
      }
      button.delete-btn {
        background: #b23b3b;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .add-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .add-form div {
        display: flex;
        flex-direction: column;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: #555;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="password"],
      select {
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
      }
      .add-form button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    {{template "nav" .}}

    <div class="page">
      <div class="panel">
        <h1>My Account: {{.Username}}</h1>
        {{if .AcctError}}
        <div class="error">{{.AcctError}}</div>
        {{end}} {{if .AcctSuccess}}
        <div class="success">Password updated successfully.</div>
        {{end}}
        <form method="POST" action="/account">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
          <div class="add-form">
            <div>
              <label for="current_password">Current Password</label>
              <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
              />
            </div>
            <div>
              <label for="new_password">New Password</label>
              <input
                type="password"
                id="new_password"
                name="new_password"
                autocomplete="new-password"
                required
              />
            </div>
            <div>
              <label for="confirm_password">Confirm New Password</label>
              <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                required
              />
            </div>
            <button type="submit">Update Password</button>
          </div>
        </form>
      </div>

      <div class="panel">
        <h1>Users</h1>
        {{if .Error}}
        <div class="error">{{.Error}}</div>
        {{end}}
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {{range .Users}}
            <tr>
              <td>{{.Username}}</td>
              <td>
                <span class="role-badge role-{{.Role}}">{{.Role}}</span>
              </td>
              <td>
                <form
                  method="POST"
                  action="/admin/users/{{.ID}}/delete"
                  onsubmit="return confirm('Delete user {{.Username}}?');"
                >
                  <input
                    type="hidden"
                    name="csrf_token"
                    value="{{$.CSRFToken}}"
                  />
                  <button type="submit" class="delete-btn">Delete</button>
                </form>
              </td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>

      <div class="panel">
        <h2>Add User</h2>
        <form class="add-form" method="POST" action="/admin/users">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
          <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div>
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="user">User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button type="submit">Add User</button>
        </form>
      </div>
    </div>
  </body>
</html>
