{{define "nav"}}
<style>
  .topnav {
    max-width: 1400px;
    margin: 0 auto 20px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1c3d5a;
    padding: 12px 20px;
    border-radius: 8px;
  }
  .topnav .brand {
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .topnav .links {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topnav a {
    color: #cfe3f0;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .topnav a:hover {
    color: #fff;
  }
  .topnav .current-user {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.12);
    padding: 4px 10px;
    border-radius: 4px;
    flex: 1;
    text-align: center;
  }
  .topnav form {
    margin: 0;
  }
  .topnav button.logout-btn {
    background: #2e86ab;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 3px;
    margin-right: 4px;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: #dfeaf3;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-switch button.active {
    background: #fff;
    color: #1c3d5a;
  }
  @media (max-width: 600px) {
    .topnav {
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
    }
    .topnav .current-user {
      order: 3;
      flex: 1 1 100%;
    }
    .topnav .links {
      width: 100%;
      flex-wrap: wrap;
      gap: 12px;
    }
  }
</style>
<div class="topnav">
  <span class="brand">ELECTROCLIMA PRO SERVICES</span>
  {{if .DisplayName}}<span class="current-user">{{.DisplayName}}</span>{{end}}
  <div class="links">
    <a href="/">Sitio Público</a>
    <a href="/app">Nueva Factura</a>
    <a href="/app/import">Importar Foto</a>
    <a href="/clients">Facturas</a>
    <a href="/admin/service-requests">Solicitudes</a>
    <a href="/admin/users">Trabajadores</a>
    {{if .IsAdmin}}
    <a href="/admin/bank">Banco</a>
    {{end}}
    <div class="lang-switch" aria-label="Selector de idioma">
      <button type="button" data-lang-toggle="es" class="active">ES</button>
      <button type="button" data-lang-toggle="en">EN</button>
    </div>
    <form method="POST" action="/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
      <button type="submit" class="logout-btn">Cerrar sesión</button>
    </form>
  </div>
</div>
<script>
  (function () {
    const STORAGE_KEY = "site_lang";

    function applyLanguage(lang) {
      const selected = lang === "en" ? "en" : "es";
      document.documentElement.lang = selected;
      localStorage.setItem(STORAGE_KEY, selected);

      document.querySelectorAll("[data-lang-toggle]").forEach((button) => {
        const isActive = button.getAttribute("data-lang-toggle") === selected;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const savedLang = localStorage.getItem(STORAGE_KEY);
      const initialLang = savedLang === "en" ? "en" : "es";

      applyLanguage(initialLang);

      document.querySelectorAll("[data-lang-toggle]").forEach((button) => {
        button.addEventListener("click", function () {
          applyLanguage(button.getAttribute("data-lang-toggle"));
        });
      });
    });
  })();
</script>
{{end}}
