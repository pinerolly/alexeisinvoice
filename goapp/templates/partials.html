{{define "nav"}}
<style>
  .topnav {
    max-width: 1400px;
    margin: 0 auto 20px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1c3d5a;
    padding: 12px 20px;
    border-radius: 8px;
  }
  .topnav .brand {
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .topnav .links {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topnav a {
    color: #cfe3f0;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .topnav a:hover {
    color: #fff;
  }
  .topnav .current-user {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.12);
    padding: 4px 10px;
    border-radius: 4px;
    flex: 1;
    text-align: center;
  }
  .topnav form {
    margin: 0;
  }
  .topnav button.logout-btn {
    background: #2e86ab;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 3px;
    margin-right: 4px;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: #dfeaf3;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-switch button.active {
    background: #fff;
    color: #1c3d5a;
  }
  @media (max-width: 600px) {
    .topnav {
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
    }
    .topnav .current-user {
      order: 3;
      flex: 1 1 100%;
    }
    .topnav .links {
      width: 100%;
      flex-wrap: wrap;
      gap: 12px;
    }
  }
</style>
<div class="topnav">
  <span class="brand">ELECTROCLIMA PRO SERVICES</span>
  {{if .DisplayName}}<span class="current-user">{{.DisplayName}}</span>{{end}}
  <div class="links">
    <a href="/">Sitio Público</a>
    <a href="/app?new=1">Nueva Factura</a>
    <a href="/clients">Facturas</a>
    <a href="/admin/service-requests">Solicitudes</a>
    <a href="/admin/users">Trabajadores</a>
    {{if .IsAdmin}}
    <a href="/admin/bank">Banco</a>
    {{end}}
    <div class="lang-switch" aria-label="Selector de idioma">
      <button type="button" data-lang-toggle="es" class="active">ES</button>
      <button type="button" data-lang-toggle="en">EN</button>
    </div>
    <form method="POST" action="/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
      <button type="submit" class="logout-btn">Cerrar sesión</button>
    </form>
  </div>
</div>

      "Ubicación:": "Location:",
      "¡Gracias por su preferencia!": "Thank you for your business!",
      "Al imprimir se actualizará este registro.": "Printing will update this record."
    };
    const placeholderToEn = {
      "Buscar por nombre, teléfono o correo...": "Search by name, phone or email...",
      "ej. Juan Pérez": "e.g. Juan Perez",
      "ej. 786 389 3330": "e.g. 786 389 3330",
      "ej. cliente@ejemplo.com": "e.g. client@example.com",
      "ej. 7820 NE 1st Ave": "e.g. 7820 NE 1st Ave",
      "Describe el trabajo realizado...": "Describe work performed...",
      "Trabajo actual": "Current work",
      "Trabajo terminado": "Completed work",
      "Próximo trabajo (mañana)": "Next work (tomorrow)"
    };
    const titleFragmentsToEn = {
      "Historial del Cliente": "Client History",
      "Editor de Facturas": "Invoice Editor",
      "Importar Foto de Factura": "Import Invoice Photo",
      "Solicitudes de Servicio": "Service Requests",
      "Trabajadores": "Workers",
      "Clientes": "Clients",
      "Facturas": "Invoices",
      "Iniciar sesión": "Sign in"
    };
    const originalTitle = document.title;

    function translateTrimmed(baseText, map) {
      const leading = baseText.match(/^\s*/)[0];
      const trailing = baseText.match(/\s*$/)[0];
      const core = baseText.trim();
      const translated = map[core];
      if (!translated) {
        return baseText;
      }
      return leading + translated + trailing;
    }

    function applyWorkerPageText(lang) {
      const isEn = lang === "en";
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent) {
            return NodeFilter.FILTER_REJECT;
          }
          const tag = parent.tagName;
          if (tag === "SCRIPT" || tag === "STYLE" || tag === "NOSCRIPT") {
            return NodeFilter.FILTER_REJECT;
          }
          if (!node.nodeValue || node.nodeValue.trim() === "") {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        },
      });

      const nodes = [];
      let current;
      while ((current = walker.nextNode())) {
        nodes.push(current);
      }

      nodes.forEach((node) => {
        if (typeof node.__esOriginal === "undefined") {
          node.__esOriginal = node.nodeValue;
        }
        if (isEn) {
          node.nodeValue = translateTrimmed(node.__esOriginal, textToEn);
        } else {
          node.nodeValue = node.__esOriginal;
        }
      });

      document.querySelectorAll("input[placeholder], textarea[placeholder]").forEach((el) => {
        if (!el.dataset.esPlaceholder) {
          el.dataset.esPlaceholder = el.getAttribute("placeholder") || "";
        }
        if (isEn) {
          const mapped = placeholderToEn[el.dataset.esPlaceholder];
          if (mapped) {
            el.setAttribute("placeholder", mapped);
          }
        } else {
          el.setAttribute("placeholder", el.dataset.esPlaceholder);
        }
      });

      document.querySelectorAll("button[title], [aria-label]").forEach((el) => {
        if (typeof el.dataset.esTitle === "undefined") {
          el.dataset.esTitle = el.getAttribute("title") || "";
        }
        if (typeof el.dataset.esAriaLabel === "undefined") {
          el.dataset.esAriaLabel = el.getAttribute("aria-label") || "";
        }
        if (isEn) {
          if (el.dataset.esTitle) {
            const mappedTitle = textToEn[el.dataset.esTitle.trim()];
            if (mappedTitle) {
              el.setAttribute("title", mappedTitle);
            }
          }
          if (el.dataset.esAriaLabel) {
            const mappedAria = textToEn[el.dataset.esAriaLabel.trim()];
            if (mappedAria) {
              el.setAttribute("aria-label", mappedAria);
            }
          }
        } else {
          if (el.dataset.esTitle) {
            el.setAttribute("title", el.dataset.esTitle);
          }
          if (el.dataset.esAriaLabel) {
            el.setAttribute("aria-label", el.dataset.esAriaLabel);
          }
        }
      });

      if (isEn) {
        let translatedTitle = originalTitle;
        Object.keys(titleFragmentsToEn).forEach((source) => {
          translatedTitle = translatedTitle.replace(source, titleFragmentsToEn[source]);
        });
        document.title = translatedTitle;
      } else {
        document.title = originalTitle;
      }
    }

    function applyLanguage(lang) {
      const selected = lang === "en" ? "en" : "es";
      document.documentElement.lang = selected;
      localStorage.setItem(STORAGE_KEY, selected);

      document.querySelectorAll("[data-lang-toggle]").forEach((button) => {
        const isActive = button.getAttribute("data-lang-toggle") === selected;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });

      applyWorkerPageText(selected);
    }

    document.addEventListener("DOMContentLoaded", function () {
      const savedLang = localStorage.getItem(STORAGE_KEY);
      const initialLang = savedLang === "en" ? "en" : "es";

      applyLanguage(initialLang);

      document.querySelectorAll("[data-lang-toggle]").forEach((button) => {
        button.addEventListener("click", function () {
          applyLanguage(button.getAttribute("data-lang-toggle"));
        });
      });
    });
  })();
</script>
